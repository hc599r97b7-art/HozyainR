{name:"Салаты",emoji:"🥗",dishes:[["Цезарь с курицей","kiss"],["Греческий салат","cheek"],["Оливье","hug"],["Крабовый салат","lips"],["Салат с тунцом","neck"],["Салат с сухариками","kiss"],["Селёдка под шубой","hold"],["Салат с курицей и ананасами","lower"],["Салат «Мимоза»","cheek"],["Салат коул-слоу","lips"],["Овощной салат","long"]]},
{name:"Закуски",emoji:"🍟",dishes:[["Картофель фри","neck"],["Картофель по-деревенски","kiss"],["Наггетсы","lips"],["Луковые кольца","hug"],["Сырные палочки","cheek"],["Рулетики из баклажана","lower"],["Фаршированные шампиньоны","spicy"]]},
{name:"Заказать малышке",emoji:"❤️",dishes:[["Роллы","free"],["Бургеры","free"],["Пицца","free"],["Готовые рёбрышки с доставкой","free"]]}

let cart={};let favorites=JSON.parse(localStorage.getItem("hozyainFavorites")||"[]");let currentCategory=0;let favoritesMode=false;
const allDishes=menuData.flatMap((cat,ci)=>cat.dishes.map((d,di)=>({id:`${ci}-${di}`,name:d[0],price:P[d[1]],emoji:cat.emoji,category:cat.name})));

function showCategory(i){currentCategory=i;favoritesMode=false;renderCats();renderMenu(menuData[i].dishes.map((d,di)=>({id:`${i}-${di}`,name:d[0],price:P[d[1]],emoji:menuData[i].emoji,category:menuData[i].name})));document.getElementById("menu").scrollIntoView({behavior:"smooth",block:"start"});}
function showFavorites(){favoritesMode=true;renderCats();renderMenu(allDishes.filter(d=>favorites.includes(d.id)));if(!favorites.length)document.getElementById("menu").innerHTML="<p>Пока нет любимых блюд. Нажми ❤️ на карточке блюда.</p>";}
const DISH_PHOTOS={"Яйца варёные": "4C02EEF6-B58F-412B-BA15-49A443C933CA.png", "Омлет": "999125EC-8166-421C-AB04-CB20301353CA.png", "Лепёшка роти с ветчиной и сыром": "C59CF09E-624E-47C2-A512-614177458EA9.png", "Лепёшка роти с творогом и зеленью": "DF1A3F8F-01B6-48F6-8C03-D34F802BF66D.png", "Авокадо-тост с яйцом пашот": "Авокадо-тост с яйцом пашот и томатами.png", "Пицца «Цезарь»": "Роскошная пицца «Цезарь» при свечах.png", "Сырники": "Роскошные сырники с ягодами и кремом.png", "Блины": "Роскошные блины с ягодами и кремом.png", "Блины со сгущёнкой": "Роскошные блинчики с ягодами и кремом.png"};
function renderMenu(list){const el=document.getElementById("menu");el.innerHTML=list.map(d=>`<article class="dish"><div class="photo">${DISH_PHOTOS[d.name]?`<img src="${DISH_PHOTOS[d.name]}" alt="${escapeHtml(d.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover">`:d.emoji}</div><div class="info"><h3>${escapeHtml(d.name)}</h3><div class="price">${d.price}</div><button class="heart" onclick="toggleFavorite('${d.id}')">${favorites.includes(d.id)?"❤️ В любимом":"🤍 В избранное"}</button><button class="add" onclick="addToCart('${d.id}')">＋ Добавить</button></div></article>`).join("")||"<p>В этой категории пока нет блюд.</p>";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem("hozyainFavorites",JSON.stringify(favorites));if(favoritesMode)showFavorites();else showCategory(currentCategory);}
function addToCart(id){const d=allDishes.find(x=>x.id===id);if(!d)return;if(!cart[id])cart[id]={...d,qty:0};cart[id].qty++;renderCart();}
function changeQty(id,delta){if(!cart[id])return;cart[id].qty+=delta;if(cart[id].qty<=0)delete cart[id];renderCart();}
function renderCart(){const entries=Object.values(cart);document.getElementById("items").innerHTML=entries.length?entries.map(d=>`<div class="line"><div><strong>${escapeHtml(d.name)}</strong><div class="price">${d.price}</div><div class="small">Количество: ${d.qty}</div></div><div><button onclick="changeQty('${d.id}',-1)">−</button> <button onclick="changeQty('${d.id}',1)">＋</button></div></div>`).join(""):"Пока ничего не выбрано";const count=entries.reduce((s,d)=>s+d.qty,0);document.getElementById("total").textContent=`Выбрано: ${count} порций`;document.getElementById("count").textContent=count;}
function surprise(){const pool=allDishes.filter(d=>favorites.includes(d.id));if(!pool.length){alert("Сначала добавь несколько блюд в избранное ❤️");return;}const d=pool[Math.floor(Math.random()*pool.length)];renderMenu([d]);document.getElementById("menu").scrollIntoView({behavior:"smooth"});}
async function order(){const entries=Object.values(cart);if(!entries.length){document.getElementById("result").textContent="Сначала добавь блюда в корзину ❤️";return;}const payload={items:entries.map(d=>({name:d.name,price:d.price,quantity:d.qty})),wish:document.getElementById("wish").value.trim(),time:document.getElementById("time").value.trim(),count:entries.reduce((s,d)=>s+d.qty,0),source:"ВЫБОР ХОЗЯИНА"};const btn=document.querySelector('#cart button[onclick="order()"]');btn.disabled=true;btn.textContent="Отправляю заказ…";try{const response=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!response.ok)throw new Error("HTTP "+response.status);document.getElementById("result").textContent="Заказ отправлен! ❤️";cart={};renderCart();}catch(e){document.getElementById("result").textContent="Не удалось отправить заказ. Попробуй ещё раз или напиши мне напрямую в Telegram.";console.error(e);}finally{btn.disabled=false;btn.textContent="Оформить заказ ❤️";}}
renderCats();showCategory(0);renderCart();
